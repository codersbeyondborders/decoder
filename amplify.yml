version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install --save-dev @babel/plugin-proposal-private-property-in-object
        - npm ci --legacy-peer-deps
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
